spring.application.name=backend
server.port=8080

# Cấu hình PostgreSQL Database (Cập nhật Username/Password/DB name thực tế sau)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobpilot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình OpenAPI (Swagger)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Cấu hình JWT
# secret-key tối thiểu 256bit
jwt.secret-key=${JWT_SECRET_KEY:VUI_LONG_NHAP_CHUOIBIMATQUANTRONG_KHONGCHIASE}
jwt.expiration=604800000


# Google Sign-In (Web client ID from Google Cloud Console)
google.client-id=866359123309-qpb7ibhpmnhoq2ukvbb0uh7mi9o7nsfp.apps.googleusercontent.com

# LangChain4j / RAG Config

# -- Cấu hình Chat Model (Sử dụng OpenRouter cho Chatbot & CV Analysis) --
langchain.chat.base-url=https://openrouter.ai/api/v1
langchain.chat.api-key=${OPENAI_API_KEY}
langchain.chat.model-name=google/gemma-3-12b-it

# -- Cấu hình Embedding Model (Sử dụng OpenRouter cho Embeddings) --
langchain.embedding.base-url=https://openrouter.ai/api/v1
langchain.embedding.api-key=${OPENAI_API_KEY}
langchain.embedding.model-name=openai/text-embedding-3-small
langchain.dimension=1536

rag.data.path=src/main/resources/rag-data
rag.load-job-store=${RAG_LOAD_JOB_STORE:true}


# ── Debug RAG retrieval ──────────────────────────────────────────────────────
# Bật để xem các đoạn tài liệu nào được retrieve và inject vào prompt mỗi lần chat
# Tắt lại (INFO) khi không cần debug nữa để giảm noise
# xóa khi log quá nhiều
logging.level.dev.langchain4j=DEBUG
logging.level.dev.langchain4j.rag=DEBUG
logging.level.com.jobportal=DEBUG 

