spring.application.name=backend
server.port=8080

# Cấu hình Oracle Database (Cập nhật Username/Password thực tế sau)
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=VUI_LONG_NHAP_USER
spring.datasource.password=VUI_LONG_NHAP_PASS
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Cấu hình JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình OpenAPI (Swagger)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Cấu hình JWT
# secret-key tối thiểu 256bit
jwt.secret-key=VUI_LONG_NHAP_CHUOIBIMATQUANTRONG_KHONGCHIASE
jwt.expiration=86400000
