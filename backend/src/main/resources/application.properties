spring.application.name=backend
server.port=8080

# Cấu hình PostgreSQL Database (Cập nhật Username/Password/DB name thực tế sau)
spring.datasource.url=jdbc:postgresql://localhost:5432/jobpilot
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình OpenAPI (Swagger)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Cấu hình JWT
# secret-key tối thiểu 256bit
jwt.secret-key=VUI_LONG_NHAP_CHUOIBIMATQUANTRONG_KHONGCHIASE
jwt.expiration=604800000


# Google Sign-In (Web client ID from Google Cloud Console)
google.client-id=866359123309-qpb7ibhpmnhoq2ukvbb0uh7mi9o7nsfp.apps.googleusercontent.com

# LangChain4j / RAG Config
# -- Dung voi LM Studio (local) --
# LM Studio chay o localhost:1234, expose OpenAI-compatible API
langchain.base-url=http://localhost:1234/v1
# API key co the de bat ky chuoi gi (LM Studio khong can xac thuc)
langchain.api-key=lm-studio
# Ten model phai khop voi model dang load trong LM Studio (VD: llama-3.2-1b-instruct)
langchain.model-name=google/gemma-4-e4b
# Model dung cho Embeddings (LM Studio cung ho tro embedding models)
langchain.embedding-model-name=text-embedding-nomic-embed-text-v1.5-embedding
rag.data.path=src/main/resources/rag-data

# ── Debug RAG retrieval ──────────────────────────────────────────────────────
# Bật để xem các đoạn tài liệu nào được retrieve và inject vào prompt mỗi lần chat
# Tắt lại (INFO) khi không cần debug nữa để giảm noise
# xóa khi log quá nhiều
logging.level.dev.langchain4j=DEBUG
logging.level.dev.langchain4j.rag=DEBUG
logging.level.com.jobportal=DEBUG 
